<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ═══════════════════════════════════════════════════════════════
     ❶ الشيء الوحيد الذي يجب تعديله: ضع رابط تطبيق جوجل (الذي ينتهي بـ /exec)
     بين علامتي التنصيص في السطر التالي، ثم احفظ الملف.
     ═══════════════════════════════════════════════════════════════ -->
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbz-JsXDmOW1RJthYKcftGHQBDCV51Bg9FEF7W1jJg7MsGnrHKYuvHRyF-1D7FgErEER/exec";
</script>
<!-- ═══════════════════════════════════════════════════════════════ -->

<title>الانتساب إلى الحزب المدني الديمقراطي الأردني</title>
<meta name="description" content="قدّم طلب انتساب إلكتروني إلى الحزب المدني الديمقراطي الأردني، وتابع حالة طلبك برقمك المرجعي.">

<!-- معاينة الرابط على فيسبوك وواتساب -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="الحزب المدني الديمقراطي الأردني">
<meta property="og:title" content="الانتساب إلى الحزب المدني الديمقراطي الأردني">
<meta property="og:description" content="املأ طلب الانتساب إلكترونياً خلال دقائق — وتابع حالة طلبك في أي وقت برقمك المرجعي.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ar_JO">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  :root{ --brand:#cb8738; --brand-dark:#8f5a16; --bg:#fbf6ef; --ink:#14110d; --muted:#6a6157 }
  *{ box-sizing:border-box }
  html,body{ height:100%; margin:0; padding:0; overflow:hidden; background:var(--bg) }
  body{ font-family:'Tajawal',Tahoma,Arial,sans-serif; color:var(--ink) }

  /* إطار التطبيق — يملأ الشاشة بالكامل بلا أي شريط */
  #app{ position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:var(--bg) }

  /* شاشة التحميل */
  #splash{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px;
    background:linear-gradient(180deg,#fffdf9,#f6ead8); transition:opacity .45s ease }
  #splash.gone{ opacity:0; pointer-events:none }
  #splash img{ width:104px; height:auto; filter:drop-shadow(0 6px 14px rgba(160,110,40,.22)) }
  #splash h1{ margin:0; font-size:19px; font-weight:800; color:var(--brand-dark); line-height:1.5 }
  #splash p{ margin:0; font-size:14px; color:var(--muted) }
  .ring{ width:34px; height:34px; border-radius:50%; border:3px solid #e7d6bb;
    border-top-color:var(--brand); animation:spin 1s linear infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } }

  /* رسالة بديلة إذا منع المتصفح عرض التطبيق داخل الصفحة */
  #fallback{ display:none; max-width:420px; background:#fff; border:1px solid #eadfcd;
    border-radius:14px; padding:20px; box-shadow:0 8px 26px rgba(120,85,30,.12) }
  #fallback a{ display:inline-block; margin-top:12px; background:var(--brand); color:#fff;
    text-decoration:none; font-weight:800; padding:12px 26px; border-radius:11px; font-size:15px }
  #fallback a:hover{ background:var(--brand-dark) }
</style>
</head>

<body>

<div id="splash">
  <img src="logo.png" alt="شعار الحزب المدني الديمقراطي الأردني">
  <h1>الحزب المدني الديمقراطي الأردني<br>الانتساب الإلكتروني</h1>
  <div class="ring" id="ring"></div>
  <p id="msg">جارٍ فتح النموذج…</p>

  <div id="fallback">
    <b style="color:var(--brand-dark)">تعذّر عرض النموذج داخل الصفحة.</b>
    <p style="margin:8px 0 0;font-size:14px;color:var(--muted)">اضغط الزر لفتحه في نافذة جديدة.</p>
    <a id="direct" href="#" target="_blank" rel="noopener">فتح نموذج الانتساب</a>
  </div>
</div>

<iframe id="app" title="نموذج الانتساب" allow="camera;clipboard-write;fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
(function(){
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');

  // تمرير ما بعد علامة ؟ إلى التطبيق — ليعمل رابط الاستعلام ورمز QR: ‎?page=status&ref=…
  var extra = window.location.search.replace(/^\?/, '');
  var url = APP_URL + (extra ? (APP_URL.indexOf('?') === -1 ? '?' : '&') + extra : '');
  document.getElementById('direct').href = url;
  frame.src = url;

  var done = false;
  frame.addEventListener('load', function(){
    done = true;
    splash.classList.add('gone');
    setTimeout(function(){ splash.style.display = 'none'; }, 500);
  });

  // إن لم يُحمَّل خلال 12 ثانية، اعرض زر الفتح المباشر
  setTimeout(function(){
    if (done) return;
    document.getElementById('ring').style.display = 'none';
    document.getElementById('msg').style.display = 'none';
    document.getElementById('fallback').style.display = 'block';
  }, 12000);
})();
</script>

</body>
</html>
